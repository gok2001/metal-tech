
name: Publicar MetalTech AR

on:
  push:
    branches:
      - feature/RA
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: realidade-aumentada/package-lock.json

      - name: Instalar dependencias
        working-directory: realidade-aumentada
        run: npm install --ignore-scripts

      - name: Compilar React
        working-directory: realidade-aumentada
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: realidade-aumentada/dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
